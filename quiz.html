<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Platform - Student Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav class="sidebar">
        <div class="logo">
            <h2><i class="fas fa-graduation-cap"></i> Portal</h2>
        </div>
        <ul class="nav-links">
            <li><a href="dashboard.html"><i class="fas fa-chart-line"></i> Dashboard</a></li>
            <li><a href="assignments.html"><i class="fas fa-tasks"></i> Assignments</a></li>
            <li><a href="gpa-calculator.html"><i class="fas fa-calculator"></i> GPA Calculator</a></li>
            <li><a href="pomodoro.html"><i class="fas fa-clock"></i> Study Timer</a></li>
            <li><a href="quiz.html" class="active"><i class="fas fa-brain"></i> Quiz & Tests</a></li>
            <li><a href="analytics.html"><i class="fas fa-chart-bar"></i> Analytics</a></li>
        </ul>
        <div class="user-section">
            <p id="user-name">Welcome, Student</p>
            <button onclick="logout()" class="btn-logout">Logout</button>
        </div>
    </nav>

    <main class="main-content">
        <header class="page-header">
            <h1><i class="fas fa-brain"></i> Interactive Quiz Platform</h1>
            <p>Test your knowledge across different subjects</p>
        </header>

        <!-- Quiz Selection Screen -->
        <div id="quiz-selection">
            <div id="quiz-subjects-grid" class="quiz-subjects-grid"></div>
        </div>

        <!-- Quiz Taking Screen -->
        <div id="quiz-taking" class="quiz-taking-container" style="display: none;">
            <div class="quiz-header">
                <div class="quiz-info">
                    <h2 id="taking-quiz-title"></h2>
                    <p id="taking-quiz-subject"></p>
                </div>
                <div class="quiz-timer">
                    <i class="fas fa-clock"></i>
                    <span id="quiz-timer-display">00s</span>
                </div>
            </div>

            <div class="quiz-progress">
                <div class="progress-bar">
                    <div id="progress-fill" class="progress-fill"></div>
                </div>
                <p>Question <span id="current-question-num">1</span> of <span id="total-questions">10</span></p>
            </div>

            <div class="question-card">
                <h3 id="question-display"></h3>
                <div id="options-display" class="options-display"></div>
            </div>

            <div class="quiz-navigation">
                <button id="prev-btn" onclick="previousQuestion()" class="btn-secondary" disabled>
                    <i class="fas fa-arrow-left"></i> Previous
                </button>
                <button id="next-btn" onclick="nextQuestion()" class="btn-primary">
                    Next <i class="fas fa-arrow-right"></i>
                </button>
                <button id="submit-btn" onclick="submitQuiz()" class="btn-primary" style="display: none;">
                    <i class="fas fa-check"></i> Submit Quiz
                </button>
            </div>
        </div>

        <!-- Quiz Results Screen -->
        <div id="quiz-results" class="quiz-results-container" style="display: none;">
            <div class="results-card">
                <div class="results-header">
                    <i class="fas fa-trophy"></i>
                    <h2>Quiz Complete!</h2>
                    <p id="grade-message"></p>
                </div>
                
                <div class="score-display">
                    <h3>Your Score</h3>
                    <p class="score-large"><span id="score-percent">0</span>%</p>
                    <p class="score-detail">
                        <span id="correct-answers">0</span> out of <span id="total-questions-result">0</span> correct
                    </p>
                </div>

                <div class="results-summary">
                    <h3><i class="fas fa-list-check"></i> Detailed Review</h3>
                    <div id="answer-review"></div>
                </div>

                <div class="results-actions">
                    <button onclick="retakeQuiz()" class="btn-secondary">
                        <i class="fas fa-redo"></i> Retake Quiz
                    </button>
                    <button onclick="backToQuizList()" class="btn-primary">
                        <i class="fas fa-home"></i> Back to Quizzes
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script src="js/utils.js"></script>
    <script src="js/quiz.js"></script>
</body>
</html>
