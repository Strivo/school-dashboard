<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPA Calculator - Student Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav class="sidebar">
        <div class="logo">
            <h2><i class="fas fa-graduation-cap"></i> Portal</h2>
        </div>
        <ul class="nav-links">
            <li><a href="dashboard.html"><i class="fas fa-chart-line"></i> Dashboard</a></li>
            <li><a href="assignments.html"><i class="fas fa-tasks"></i> Assignments</a></li>
            <li><a href="gpa-calculator.html" class="active"><i class="fas fa-calculator"></i> GPA Calculator</a></li>
            <li><a href="pomodoro.html"><i class="fas fa-clock"></i> Study Timer</a></li>
            <li><a href="quiz.html"><i class="fas fa-brain"></i> Quiz & Tests</a></li>
            <li><a href="analytics.html"><i class="fas fa-chart-bar"></i> Analytics</a></li>
        </ul>
        <div class="user-section">
            <p id="user-name">Welcome, Student</p>
            <button onclick="logout()" class="btn-logout">Logout</button>
        </div>
    </nav>

    <main class="main-content">
        <header class="page-header">
            <h1><i class="fas fa-calculator"></i> GPA Calculator</h1>
        </header>

        <div class="gpa-section">
            <div class="gpa-input-container">
                <h2>Add Your Courses</h2>
                <div id="courses-container"></div>
                <div class="gpa-form-buttons">
                    <button onclick="addCourse()" class="btn-secondary">+ Add Course</button>
                    <button onclick="calculateGPA()" class="btn-primary">Calculate GPA</button>
                </div>
            </div>

            <div class="gpa-result-container">
                <h2>Your Results</h2>
                <div class="result-display">
                    <div class="gpa-display">
                        <h3>Current GPA</h3>
                        <p class="gpa-value" id="gpa-result">0.00</p>
                    </div>
                    <div class="grade-breakdown" id="grade-breakdown"></div>
                </div>
                <button onclick="saveGPA()" class="btn-save">Save GPA</button>
            </div>
        </div>

        <div class="gpa-history">
            <h2>GPA History</h2>
            <div id="gpa-history-list"></div>
        </div>
    </main>

    <script src="js/utils.js"></script>
    <script src="js/gpa-calculator.js"></script>
</body>
</html>
